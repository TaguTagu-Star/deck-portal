name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check（anyの混入もここで検知）
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: DBスキーマ変更にmigrationファイルが伴っているか確認
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^src/domain/schemas/|^src/repositories/' > /dev/null; then
            if ! echo "$CHANGED" | grep -E '^supabase/migrations/.*\.sql$' > /dev/null; then
              echo "::warning::スキーマ関連の変更が含まれていますが、supabase/migrations 配下にSQLファイルが見つかりません。破壊的なDB変更の場合はmigrationを追加してください。"
            fi
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaksによるシークレットスキャン
        uses: gitleaks/gitleaks-action@v2

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
